  name: Vast.ai REST API
  description: >-
    The Vast.ai REST API is the control plane for the GPU marketplace. It supports searching offers across
    hosts, renting and managing instances, configuring machines and templates, attaching persistent volumes,
    managing serverless endpoints, and querying billing and usage. Authentication uses bearer tokens issued
    from the Keys management page.
