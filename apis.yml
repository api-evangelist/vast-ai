- type: Features
  data:
  - name: GPU Marketplace
    description: Market-driven matching of buyers with 40+ datacenters and individual
      hosts across 68+ GPU types.
  - name: On-Demand Instances
    description: Per-second-billed GPU rentals with guaranteed uptime, with no minimum
      hours.
  - name: Interruptible Instances
    description: Fault-tolerant workloads priced 50%+ cheaper than on-demand with
      potential preemption.
  - name: Reserved Capacity
    description: Up to 50% discounts on 1, 3, or 6-month commitments for stable workloads.
  - name: Serverless Endpoints
    description: Serverless GPU workers built on the pyworker agent for autoscaling
      inference.
  - name: Templates
    description: Pre-configured instance templates for fast launching of common workloads.
- type: GPUs
  data:
  - name: NVIDIA B200
    description: Blackwell-generation flagship GPU available across hosts.
  - name: NVIDIA H200
    description: 141GB HBM3e GPU available across hosts.
  - name: NVIDIA H100
    description: 80GB Hopper GPU widely available across the marketplace.
  - name: NVIDIA A100
    description: 80GB Ampere GPU widely available across the marketplace.
  - name: NVIDIA RTX 4090
    description: 24GB consumer GPU, popular for inference and fine-tuning.
  - name: NVIDIA RTX 3060
    description: 12GB consumer GPU at entry-level price points.
- type: Integrations
  data:
  - name: Docker
    description: Bring-your-own Docker image support across all rental instances.
  - name: SSH
    description: Direct SSH access to rented instances for development and orchestration.
